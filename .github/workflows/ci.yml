name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout v4

      - name: Set up Go
        uses: actions/setup-go v5
        with:
          go-version: "1.22"
          cache: true

      - name: Run unit tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact v4
        with:
          name: coverage
          path: coverage.out

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout v4

      - name: Set up Go
        uses: actions/setup-go v5
        with:
          go-version: "1.22"
          cache: true

      - name: Run E2E tests
        env:
          RUN_FULL_E2E: "1"
          RUN_BACKUP_TESTS: "1"
        run: |
          cd e2e
          chmod +x docker-test.sh
          ./docker-test.sh
